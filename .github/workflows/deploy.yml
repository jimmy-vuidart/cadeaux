# Workflow CI/CD pour l'application Cadeaux.
# Déclenché manuellement via workflow_dispatch avec choix d'incrément SemVer (hotfix, minor, major).
# Détermine et incrémente la version à partir du package.json du projet Angular,
# exécute les tests, compile le frontend, publie les images conteneurs sur GHCR,
# committe la nouvelle version de package.json, pose le tag Git et synchronise noctali.cd.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type d’incrément de version'
        required: true
        type: choice
        default: 'hotfix'
        options:
          - hotfix
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test, Push GHCR & Sync GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Determine and bump SemVer from package.json
        id: vars
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Version actuelle dans package.json : ${CURRENT_VERSION}"

          case "${{ inputs.release_type }}" in
            major)
              SEMVER_TYPE="major"
              ;;
            minor)
              SEMVER_TYPE="minor"
              ;;
            hotfix)
              SEMVER_TYPE="patch"
              ;;
            *)
              echo "Type d’incrément non reconnu : ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

          NEW_RAW=$(npm version "${SEMVER_TYPE}" --no-git-tag-version)
          NEW_TAG="${NEW_RAW#v}"

          echo "Nouvelle version package.json : ${NEW_TAG}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jimmy-vuidart/cadeaux-frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/jimmy-vuidart/cadeaux-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PocketBase Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pocketbase
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jimmy-vuidart/cadeaux-pocketbase:${{ steps.vars.outputs.tag }}
            ghcr.io/jimmy-vuidart/cadeaux-pocketbase:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump and push Git tag on cadeaux
        run: |
          NEW_TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore(release): bump version to ${NEW_TAG}"
          git tag -a "v${NEW_TAG}" -m "Release v${NEW_TAG}"

          git pull --rebase origin main
          git push origin main --tags
          echo "Version ${NEW_TAG} committée et tag Git v${NEW_TAG} poussé sur cadeaux."

      - name: Checkout GitOps repo (noctali.cd)
        uses: actions/checkout@v4
        with:
          repository: jimmy-vuidart/noctali.cd
          ref: master
          token: ${{ secrets.NOCTALI_CD_TOKEN || secrets.GITOPS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: noctali.cd

      - name: Update image tags in noctali.cd kustomization.yaml
        id: update-manifest
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          KUSTOMIZE_FILE="noctali.cd/apps/cadeaux/kustomization.yaml"
          echo "Mise à jour des tags d'images vers ${TAG} dans ${KUSTOMIZE_FILE}"

          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-frontend/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"
          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-pocketbase/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"

      - name: Commit and push changes to noctali.cd
        run: |
          cd noctali.cd

          if git diff --quiet apps/cadeaux/kustomization.yaml; then
            echo "Aucune modification détectée dans apps/cadeaux/kustomization.yaml. Rien à committer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/cadeaux/kustomization.yaml
          git commit -m "cd(cadeaux): update images to ${{ steps.vars.outputs.tag }}"
          git pull --rebase origin master
          git push origin master

          echo "Manifestes mis à jour et poussés sur noctali.cd. ArgoCD va synchroniser la nouvelle version."
