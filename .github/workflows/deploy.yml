# Workflow CI/CD pour l'application Cadeaux.
# Déclenché manuellement via workflow_dispatch avec choix d'incrément SemVer (hotfix, minor, major).
# Exécute les tests, compile le frontend, publie les images conteneurs sur GHCR,
# pose le tag Git versionné et synchronise le tag dans le dépôt GitOps noctali.cd.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type d’incrément de version'
        required: true
        type: choice
        default: 'hotfix'
        options:
          - hotfix
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test, Push GHCR & Sync GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Determine new SemVer tag
        id: vars
        run: |
          git fetch --tags --force 2>/dev/null || true

          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "Dernier tag détecté : ${LATEST_TAG:-aucun}"

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION:-0.0.0}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "${{ inputs.release_type }}" in
            major)
              NEW_TAG="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_TAG="${MAJOR}.$((MINOR + 1)).0"
              ;;
            hotfix)
              NEW_TAG="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
            *)
              echo "Type de release non reconnu : ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

          echo "Nouveau tag calculé : ${NEW_TAG}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jimmy-vuidart/cadeaux-frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/jimmy-vuidart/cadeaux-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PocketBase Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pocketbase
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jimmy-vuidart/cadeaux-pocketbase:${{ steps.vars.outputs.tag }}
            ghcr.io/jimmy-vuidart/cadeaux-pocketbase:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag on cadeaux
        run: |
          NEW_TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v${NEW_TAG}" -m "Release v${NEW_TAG}"
          git push origin "v${NEW_TAG}"
          echo "Tag Git v${NEW_TAG} poussé sur origin."

      - name: Checkout GitOps repo (noctali.cd)
        uses: actions/checkout@v4
        with:
          repository: jimmy-vuidart/noctali.cd
          ref: master
          token: ${{ secrets.NOCTALI_CD_TOKEN || secrets.GITOPS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: noctali.cd

      - name: Update image tags in noctali.cd kustomization.yaml
        id: update-manifest
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          KUSTOMIZE_FILE="noctali.cd/apps/cadeaux/kustomization.yaml"
          echo "Mise à jour des tags d'images vers ${TAG} dans ${KUSTOMIZE_FILE}"

          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-frontend/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"
          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-pocketbase/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"

      - name: Commit and push changes to noctali.cd
        run: |
          cd noctali.cd

          if git diff --quiet apps/cadeaux/kustomization.yaml; then
            echo "Aucune modification détectée dans apps/cadeaux/kustomization.yaml. Rien à committer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/cadeaux/kustomization.yaml
          git commit -m "cd(cadeaux): update images to ${{ steps.vars.outputs.tag }}"
          git pull --rebase origin master
          git push origin master

          echo "Manifestes mis à jour et poussés sur noctali.cd. ArgoCD va synchroniser la nouvelle version."
