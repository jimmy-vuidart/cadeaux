# Workflow CI/CD pour l'application Cadeaux.
# Exécute les tests unitaires et le build Angular, construit et publie les images
# Docker du frontend et de PocketBase sur GHCR, puis synchronise les tags dans noctali.cd.

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag personnalisé pour les images Docker (laisser vide pour sha-<commit>)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test, Push GHCR & Sync GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Determine image tag
        id: vars
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi

          TAGS_FRONTEND="ghcr.io/jimmy-vuidart/cadeaux-frontend:${TAG}"
          TAGS_POCKETBASE="ghcr.io/jimmy-vuidart/cadeaux-pocketbase:${TAG}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS_FRONTEND="${TAGS_FRONTEND},ghcr.io/jimmy-vuidart/cadeaux-frontend:latest"
            TAGS_POCKETBASE="${TAGS_POCKETBASE},ghcr.io/jimmy-vuidart/cadeaux-pocketbase:latest"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${TAGS_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "pocketbase_tags=${TAGS_POCKETBASE}" >> "$GITHUB_OUTPUT"
          echo "Image tag déterminé : ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PocketBase Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pocketbase
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.pocketbase_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo (noctali.cd)
        uses: actions/checkout@v4
        with:
          repository: jimmy-vuidart/noctali.cd
          ref: master
          token: ${{ secrets.NOCTALI_CD_TOKEN || secrets.GITOPS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: noctali.cd

      - name: Update image tags in noctali.cd kustomization.yaml
        id: update-manifest
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          KUSTOMIZE_FILE="noctali.cd/apps/cadeaux/kustomization.yaml"
          echo "Mise à jour des tags d'images vers ${TAG} dans ${KUSTOMIZE_FILE}"

          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-frontend/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"
          sed -i -E "/name: ghcr\.io\/jimmy-vuidart\/cadeaux-pocketbase/{n;s/newTag: .*/newTag: \"${TAG}\"/}" "${KUSTOMIZE_FILE}"

      - name: Commit and push changes to noctali.cd
        run: |
          cd noctali.cd

          if git diff --quiet apps/cadeaux/kustomization.yaml; then
            echo "Aucune modification détectée dans apps/cadeaux/kustomization.yaml. Rien à committer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/cadeaux/kustomization.yaml
          git commit -m "cd(cadeaux): update images to ${{ steps.vars.outputs.tag }}"
          git pull --rebase origin master
          git push origin master

          echo "Manifestes mis à jour et poussés sur noctali.cd. ArgoCD va synchroniser la nouvelle version."
