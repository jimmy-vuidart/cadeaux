# Configuration Nginx pour le service de l'application Angular en mode Single Page Application (SPA).
# Redirige toutes les requêtes de routes virtuelles vers index.html et configure la mise en cache des assets statiques.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets avec empreinte immuable (cache 1 an)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Redirection SPA par défaut
    location / {
        try_files $uri $uri/ /index.html;
    }
}
