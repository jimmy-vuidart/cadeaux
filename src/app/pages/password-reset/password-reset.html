<div class="min-h-screen grid place-items-center px-4 py-8 relative z-10 main-content">
  <div class="glass-panel max-w-md w-full p-6 sm:p-10 animate-fade-in-up">
    <h1 class="text-3xl font-bold font-christmas text-gold-gradient drop-shadow-2xl mb-6 tracking-wider text-center">
      Nouveau mot de passe
    </h1>

    @if (done()) {
      <div class="space-y-6 text-center">
        <p class="text-green-300 text-sm bg-green-900/30 p-3 rounded">
          Ton mot de passe a été modifié. Tu peux maintenant te connecter avec ton nouveau mot de passe.
        </p>
        <a routerLink="/">
          <app-christmas-button variant="primary" size="md">
            Retour à l'accueil
          </app-christmas-button>
        </a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <input
          type="password"
          formControlName="password"
          uiInput
          placeholder="Nouveau mot de passe"
          autocomplete="new-password"
          [invalid]="form.controls.password.invalid && form.controls.password.touched"
        >
        <input
          type="password"
          formControlName="confirmPassword"
          uiInput
          placeholder="Confirmer le mot de passe"
          autocomplete="new-password"
          [invalid]="form.hasError('passwordMismatch') && form.controls.confirmPassword.touched"
        >

        @if (error()) {
          <p class="text-red-300 text-xs bg-red-900/30 p-2 rounded">{{ error() }}</p>
        }

        <app-christmas-button variant="primary" size="md" [disabled]="loading()" [customClass]="'w-full justify-center'">
          Enregistrer le mot de passe
        </app-christmas-button>
      </form>
    }
  </div>
</div>
