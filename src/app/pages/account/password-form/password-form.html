@if (user()) {
  <section class="bg-black/20 rounded-2xl p-4 sm:p-6 border border-white/5">
    <h2 class="text-xl font-bold font-christmas text-gold-400 mb-4 flex items-center gap-2">
      <span translate="no" class="material-symbols-outlined text-gold-400">lock</span>
      Mot de passe
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
      <!-- Champ caché aidant les gestionnaires de mots de passe à associer le compte -->
      <input type="email" class="hidden" [value]="user()?.email ?? ''" autocomplete="username" readonly tabindex="-1" aria-hidden="true">
      <input
        type="password"
        formControlName="currentPassword"
        uiInput
        placeholder="Mot de passe actuel"
        autocomplete="current-password"
        [invalid]="form.controls.currentPassword.invalid && form.controls.currentPassword.touched"
      >
      <input
        type="password"
        formControlName="password"
        uiInput
        placeholder="Nouveau mot de passe"
        autocomplete="new-password"
        [invalid]="form.controls.password.invalid && form.controls.password.touched"
      >
      <input
        type="password"
        formControlName="confirmPassword"
        uiInput
        placeholder="Confirmer le nouveau mot de passe"
        autocomplete="new-password"
        [invalid]="form.hasError('passwordMismatch') && form.controls.confirmPassword.touched"
      >

      @if (error()) {
        <p class="text-red-300 text-xs bg-red-900/30 p-2 rounded">{{ error() }}</p>
      }

      @if (success()) {
        <p class="text-green-300 text-xs bg-green-900/30 p-2 rounded">{{ success() }}</p>
      }

      <app-christmas-button variant="primary" size="sm" [disabled]="loading()" [busy]="loading()">
        Changer le mot de passe
      </app-christmas-button>
    </form>

    <p class="text-xs text-white/50 mt-4">
      Compte créé avec Google ou mot de passe actuel oublié ?
      <button type="button" (click)="sendResetLink()" [disabled]="loading()" class="inline text-left underline underline-offset-4 hover:text-white transition-colors">
        Recevoir un lien par email pour définir un mot de passe
      </button>
    </p>
  </section>
}
